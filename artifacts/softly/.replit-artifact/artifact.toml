kind = "web"
previewPath = "/"
title = "Softly Wellness Companion"
description = "A warm, shame-free daily wellness check-in that lets people record small acts of care and revisit their past entries without scores, streaks, or judgment."
version = "1.0.0"
id = "artifacts/softly"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20809

[services.development]
run = "pnpm --filter @workspace/softly run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/softly", "run", "build" ]
serve = "static"
publicDir = "artifacts/softly/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20809"
BASE_PATH = "/"
